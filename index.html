<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>My CV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta property="og:title" content="Nuntawat SaeHuam - CV" />
  <meta property="og:description" content="Computer Science student, KKU" />
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
      background: #0b0b0b;
    }

    iframe,
    object {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #222;
    }

    .fallback {
      display: none;
      place-items: center;
      color: #fff;
      position: fixed;
      inset: 0;
      padding: 24px;
      text-align: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .fallback a {
      color: #fff;
      font-weight: 700;
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <iframe src="CV-Nuntawat-Saehuam.pdf#zoom=page-width" id="pdfFrame" title="CV"></iframe>

  <div class="fallback" id="fallback">
    ไม่สามารถแสดง PDF ได้<br /><br />
    <a href="CV-Nuntawat-Saehuam.pdf" target="_blank" rel="noopener">เปิดในแท็บใหม่</a>
  </div>

  <script>
    const iframe = document.getElementById("pdfFrame");
    const fallback = document.getElementById("fallback");
    let loaded = false;
    iframe.addEventListener("load", () => { loaded = true; });
    setTimeout(() => {
      if (!loaded) {
        iframe.style.display = "none";
        fallback.style.display = "grid";
      }
    }, 3000);
  </script>
</body>

</html>
